shellEmulator: true
shamefullyHoist: true
strictPeerDependencies: true

trustPolicy: no-downgrade

overrides:
  # Nuxt 4.5 supports Unhead >=3.1.8. Keep the suite on the last patch
  # before @vitejs/devtools-kit 0.4 introduced an inconsistent peer graph.
  unhead: 3.2.1
  "@unhead/vue": 3.2.1
  "@unhead/bundler": 3.2.1
  semver@6: 6.3.0
  "workbox-build@7.4.0>rollup": 2.79.2
  workbox-build: 7.4.0

peerDependencyRules:
  allowedVersions:
    eslint: ">=8.57.0"
    unctx@3>oxc-parser: ">=0.137.0"

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  rollup: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

minimumReleaseAgeExclude:
  - "@happydesigns/ui@0.15.0 || 0.15.1 || 0.16.0 || 0.17.0 || 0.17.1 || 0.17.2 || 0.17.5 || 0.18.0 || 0.19.0 || 0.19.1 || 0.19.2"
  - nuxt@4.5.1
  - "@nuxt/kit@4.5.1"
  - "@nuxt/nitro-server@4.5.1"
  - "@nuxt/schema@4.5.1"
  - "@nuxt/vite-builder@4.5.1"
  - "@happydesigns/nuxt-variants@0.1.1"

patchedDependencies:
  nuxt-studio@1.7.0: patches/nuxt-studio@1.7.0.patch
